<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | 함께 시작해요</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <div class="container">
        <div class="glass-panel">
            <div class="header">
                <h1>회원가입</h1>
                <p>프리미엄 서비스와 함께 새로운 여정을 시작하세요.</p>
            </div>
            
            <form id="signupForm" class="signup-form">
                <div class="input-group">
                    <label for="fullName">이름</label>
                    <input type="text" id="fullName" name="fullName" placeholder="홍길동" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                
                <div class="input-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" placeholder="hong@example.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="강력한 비밀번호를 입력하세요" required>
                    <span class="error-message" id="passwordError"></span>
                </div>
                
                <div class="input-group">
                    <label for="confirmPassword">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">가입하기</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            
            <div class="footer">
                <p>이미 계정이 있으신가요? <a href="#" class="login-link">로그인</a></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
